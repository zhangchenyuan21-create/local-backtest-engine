[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jq-local-backtest-engine"
version = "0.8.0"
description = "A local JoinQuant-compatible backtest engine with A-share execution constraints, research metrics, factor evaluation, walk-forward ML signals, overfitting diagnostics and paper trading brokers, reconciliation, Qlib CSV bridges, optional live adapters and a post-backtest analysis report, Tushare-compatible data roots, checkpoint/resume and a NumPy fast path."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "K1294" }]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pyarrow>=12.0",
]

[project.optional-dependencies]
fast = ["polars>=1.0"]
ml = ["scikit-learn>=1.3", "lightgbm>=4.0"]
qlib = ["pyqlib>=0.9"]
live = ["vnpy>=3.0"]

[project.urls]
Homepage = "https://github.com/zhangchenyuan21-create/local-backtest-engine"
Repository = "https://github.com/zhangchenyuan21-create/local-backtest-engine"
Issues = "https://github.com/zhangchenyuan21-create/local-backtest-engine/issues"

[tool.setuptools]
py-modules = ["runner", "runner_main", "analysis_report", "analytics", "broker", "factors", "ml", "ml_models", "overfit", "optimize", "paper_trade", "qlib_bridge", "reconcile", "walkforward"]
packages = ["jqdata", "jqdata.fastcore", "live"]
